version: "3.9"

services:
  redis:
    image: redis:7-alpine
    container_name: log-aggregator-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  swagger-ui:
    image: swaggerapi/swagger-ui
    container_name: log-aggregator-swagger
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      SWAGGER_JSON: /swagger/swagger.yaml
    volumes:
      - ./docs:/swagger

networks:
  default:
    name: log-aggregator-network